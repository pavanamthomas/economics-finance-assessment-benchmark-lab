name: Apply assessment integrity audit

on:
  push:
    branches: [assessment-integrity-audit-2026-08-26]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[integrity-audit-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assessment-integrity-audit-2026-08-26
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Normalise one wrapped migration anchor
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_assessment_integrity_audit.py')
          t = p.read_text(encoding='utf-8')
          old = '"The desk\'s mandate, as written, is \\"minimise shortfall versus VWAP.\\" The\\n  desk can choose when to trade inside the day.",'
          new = '"The\\n  desk\'s mandate, as written, is \\"minimise shortfall versus VWAP.\\" The\\n  desk can choose when to trade inside the day.",'
          old2 = '"The desk\'s mandate, as written, is \\"minimise shortfall versus VWAP.\\" The\\n  investment decision, however, is to complete the position before earnings\\n  while minimising implementation shortfall relative to the arrival decision price.\\n  The desk can choose when to trade inside the day.",'
          new2 = '"The\\n  desk\'s mandate, as written, is \\"minimise shortfall versus VWAP.\\" The\\n  investment decision, however, is to complete the position before earnings\\n  while minimising implementation shortfall relative to the arrival decision price.\\n  The desk can choose when to trade inside the day.",'
          if old not in t or old2 not in t:
              raise SystemExit('migration anchor patch not found')
          p.write_text(t.replace(old, new).replace(old2, new2), encoding='utf-8')
          PY
      - name: Apply deterministic audit corrections
        run: python scripts/apply_assessment_integrity_audit.py
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run tests and validation
        run: |
          python -m pytest -q
          python scripts/validate_items.py
          python scripts/run_all.py
      - name: Commit audited corpus
        run: |
          git config user.name "Pavanam Thomas"
          git config user.email "thomaspavanam@gmail.com"
          git add -A
          git commit -m "audit assessment validity and answer-position leakage [integrity-audit-applied]"
          git push origin HEAD:assessment-integrity-audit-2026-08-26
