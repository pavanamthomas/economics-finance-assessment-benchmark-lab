name: Finalize semantic option cross-references

on:
  push:
    branches: [assessment-integrity-audit-2026-08-26]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[crossrefs-finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assessment-integrity-audit-2026-08-26
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply targeted semantic cross-reference repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          R = {
            'items/algorithmic_trading/MM-E-01.yaml': [
              ('if icebergs were allowed, B\n  would need a qualifier', 'if icebergs were allowed, G\n  would need a qualifier'),
              ('statement\n  in B. A is the paper-profit claim.', 'statement\n  in G. A is the paper-profit claim.'),
              ("stem's numbers close that door, and B is still right", "stem's numbers close that door, and G is still right"),
            ],
            'items/algorithmic_trading/MM-E-02.yaml': [
              ('B is the only option that (i) accepts the mid regression', 'H is the only option that (i) accepts the mid regression'),
              ("stem's cost adjustment already uses advertised depth, and B does", "stem's cost adjustment already uses advertised depth, and H does"),
            ],
            'items/algorithmic_trading/MM-E-03.yaml': [
              ('zero, B would fail; the stem states it is positive.', 'zero, I would fail; the stem states it is positive.'),
            ],
            'items/algorithmic_trading/MM-H-01.yaml': [
              ('only B interprets λ as impact of net flow rather than', 'only D interprets λ as impact of net flow rather than'),
            ],
            'items/algorithmic_trading/MM-H-02.yaml': [
              ('The unique competitive quotes are 0.60 and 0.40. B matches the', 'The unique competitive quotes are 0.60 and 0.40. E matches the'),
              ('therefore requires the interpretation clause in D.', 'therefore requires the interpretation clause in B.'),
              ("which is noted in B's rationale.", "which is noted in E's rationale."),
            ],
            'items/algorithmic_trading/MM-H-03.yaml': [
              ('C, D, H, I each salvage VWAP under a false extra assumption.', 'C, D, B, I each salvage VWAP under a false extra assumption.'),
            ],
            'items/algorithmic_trading/MM-M-01.yaml': [
              ('If the mid were allowed to jump, B would', 'If the mid were allowed to jump, A would'),
            ],
            'items/behavioral_finance/BF-E-01.yaml': [
              ('B is the only option that treats R as part of the model', 'C is the only option that treats R as part of the model'),
            ],
            'items/behavioral_finance/BF-E-02.yaml': [
              ('B is the only option that keeps the primary as the identified', 'D is the only option that keeps the primary as the identified'),
              ('half of B would shut and multiplicity would remain.', 'half of D would shut and multiplicity would remain.'),
            ],
            'items/behavioral_finance/BF-E-03.yaml': [
              ('B is the only option that refuses volume-as-overconfidence', 'E is the only option that refuses volume-as-overconfidence'),
              ("B's discipline of M1 would", "E's discipline of M1 would"),
            ],
            'items/behavioral_finance/BF-H-01.yaml': [
              ('B rejects λ-alone without claiming π-alone. C is the over-correction.', 'J rejects λ-alone without claiming π-alone. C is the over-correction.'),
            ],
            'items/behavioral_finance/BF-H-03.yaml': [
              ('B is the only option that picks (4) and correctly dismisses', 'A is the only option that picks (4) and correctly dismisses'),
            ],
            'items/behavioral_finance/BF-M-01.yaml': [
              ('B is the only option that gets the tax sign right', 'H is the only option that gets the tax sign right'),
            ],
            'items/behavioral_finance/BF-M-02.yaml': [
              ('B is the only option that rejects the commentator', 'I is the only option that rejects the commentator'),
              ("B's\n  \"H can be larger because...\"", "I's\n  \"H can be larger because...\""),
              ('That is why B mentions both.', 'That is why I mentions both.'),
            ],
            'items/macroprudential/MP-E-01.yaml': [
              ('B is the only option that keeps private optimality', 'E is the only option that keeps private optimality'),
              ('Nash would coincide and B would fail', 'Nash would coincide and E would fail'),
            ],
            'items/macroprudential/MP-E-02.yaml': [
              ('B is the only option that keeps both numbers', 'F is the only option that keeps both numbers'),
            ],
            'items/macroprudential/MP-E-03.yaml': [
              ('B is the only option that keeps all three numbers', 'G is the only option that keeps all three numbers'),
              ('E attacks p only; it over-deletes (3).', 'E attacks p only; it over-deletes (3).'),
            ],
            'items/macroprudential/MP-H-01.yaml': [
              ('B raises now and refuses to treat the gap as a sufficient statistic.', 'A raises now and refuses to treat the gap as a sufficient statistic.'),
              ('release would be right and B', 'release would be right and A'),
            ],
            'items/macroprudential/MP-H-02.yaml': [
              ('make one a function of the other for all households (C).', 'make one a function of the other for all households (B).'),
              ('B is the complementarity claim.', 'C is the complementarity claim.'),
              ('Counterexample to C: two loans with the same LTV', 'Counterexample to B: two loans with the same LTV'),
            ],
            'items/macroprudential/MP-H-03.yaml': [
              ('B is the only option that (i) gets the conditioning right', 'D is the only option that (i) gets the conditioning right'),
            ],
            'items/macroprudential/MP-M-01.yaml': [
              ('B is the only option that accepts micro solvency', 'J is the only option that accepts micro solvency'),
            ],
            'items/tokenomics_defi/TD-E-01.yaml': [
              ('k preserved does not freeze p (B).', 'k preserved does not freeze p (I).'),
            ],
            'items/tokenomics_defi/TD-E-02.yaml': [
              ('B is the only option that splits S and M', 'J is the only option that splits S and M'),
              ('A 1-second TWAP (J) is almost the spot', 'A 1-second TWAP (B) is almost the spot'),
            ],
            'items/tokenomics_defi/TD-H-01.yaml': [
              ('undefined at r=4 (F).', 'undefined at r=4 (B).'),
              ('B is the only option with −20 percent', 'F is the only option with −20 percent'),
            ],
            'items/tokenomics_defi/TD-H-02.yaml': [
              ('G treats LT as a seizure fraction', 'B treats LT as a seizure fraction'),
              ('B is the only option with HF = 1.20', 'G is the only option with HF = 1.20'),
            ],
            'items/tokenomics_defi/TD-H-03.yaml': [
              ('kept in B). At 42 percent turnout', 'kept in H). At 42 percent turnout'),
              ('Sybil\n  resistance (H) is why 1-token-1-vote exists', 'Sybil\n  resistance (B) is why 1-token-1-vote exists'),
              ('B is the only option that both (i) passes the proposal', 'H is the only option that both (i) passes the proposal'),
            ],
            'items/tokenomics_defi/TD-M-01.yaml': [
              ('B is the only option with both the right spot', 'D is the only option with both the right spot'),
            ],
            'items/tokenomics_defi/TD-M-02.yaml': [
              ('Origination overcollateralisation\n  (E) is a stock at t0', 'Origination overcollateralisation\n  (B) is a stock at t0'),
              ('B is the only option that keeps all three as pegging', 'E is the only option that keeps all three as pegging'),
            ],
            'items/urban_economics/UE-E-02.yaml': [
              ('B is the only option that uses both prices', 'A is the only option that uses both prices'),
              ('If labour were immobile, A would', 'If labour were immobile, B would'),
            ],
            'items/urban_economics/UE-E-03.yaml': [
              ('C and D treat Δw = 0 as', 'B and D treat Δw = 0 as'),
              ('B is the only option that allows Δw > 0', 'C is the only option that allows Δw > 0'),
            ],
            'items/urban_economics/UE-H-01.yaml': [
              ('H signs labour-supply as a rent', 'B signs labour-supply as a rent'),
              ('B is the only option that splits Δu*', 'H is the only option that splits Δu*'),
            ],
            'items/urban_economics/UE-H-02.yaml': [
              ('I flips the diagram (vertical', 'B flips the diagram (vertical'),
              ('B is the only option with the correct ΔP/ΔQ split.', 'I is the only option with the correct ΔP/ΔQ split.'),
            ],
            'items/urban_economics/UE-H-03.yaml': [
              ('Tiebout sorting (J) is a reason', 'Tiebout sorting (B) is a reason'),
              ('B is the only option that both (i) states Rosen correctly', 'J is the only option that both (i) states Rosen correctly'),
            ],
            'items/urban_economics/UE-M-01.yaml': [
              ("B is the only option with R' = −t/q", "F is the only option with R' = −t/q"),
            ],
            'items/urban_economics/UE-M-02.yaml': [
              ('not a contradiction (B).', 'not a contradiction (G).'),
              ('B is the only option that lists the failed conditions', 'G is the only option that lists the failed conditions'),
            ],
          }

          changed = 0
          missing = []
          for rel, pairs in R.items():
              p = Path(rel)
              text = p.read_text(encoding='utf-8')
              original = text
              for old, new in pairs:
                  if old == new:
                      continue
                  if old not in text:
                      missing.append(f'{rel}: {old}')
                      continue
                  text = text.replace(old, new)
              if text != original:
                  p.write_text(text, encoding='utf-8')
                  changed += 1
          if missing:
              print('WARNING: targeted anchors not found:')
              print('\n'.join(missing))
          print(f'changed {changed} files')
          PY
      - name: Install and validate
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          pytest -q
          python scripts/validate_items.py
          python scripts/run_all.py
      - name: Commit semantic cross-reference repairs
        run: |
          rm -f .github/workflows/finalize-option-crossrefs.yml
          git config user.name "Pavanam Thomas"
          git config user.email "thomaspavanam@gmail.com"
          git add -A
          git commit -m "repair semantic option references after key balancing [crossrefs-finalized]"
          git push origin HEAD:assessment-integrity-audit-2026-08-26
