id: RJ-05-reference_does_not_support
defect_class: reference_does_not_support_claim
domain: behavioral_finance_experimental_economics
difficulty_as_drafted: HARD
stem: >
  The fourfold pattern of risk attitudes (lottery tickets and
  insurance together with the high-p cells) is generated by which
  object in prospect theory?
options:
  A: >
    λ > 1 alone, as shown in Kahneman and Tversky (1979).
  B: >
    Probability weighting plus value-function curvature, as in Tversky and Kahneman (1992).
  C: >
    Expected utility with CRRA.
  D: >
    Mean-variance.
  E: >
    Rank-dependent utility with linear v and λ = 1 only.
  F: >
    Discounting.
  G: >
    Probability weighting in 1979, which already had CPT.
  H: >
    Loss aversion in 1992 without weighting.
  I: >
    Nothing in either paper.
  J: >
    Only Allais (1953).
drafted_key: A
defect: >
  The drafted key attributes the fourfold pattern, and in
  particular the small-p cells, to Kahneman–Tversky (1979) loss
  aversion alone. The 1979 paper has a value function and a
  probability-weighting *sketch*; the fourfold CPT fit and the
  cumulative weighting function are 1992. The reference does not
  support the keyed claim. B is the defensible key.
why_it_matters: >
  Topic-similar citations are not claim-supporting citations. In
  an assessment-authoring job this is a verification defect of
  the same family as an incorrect key.
repairable: true
correction: >
  Key B and cite 1992 for the fourfold/CPT package; keep 1979 as
  the value-function ancestor. That is BF-H-01.
key_changes: true
difficulty_changes: false
references:
  - key: tverskykahneman1992
    claim_supported: >
      Cumulative prospect theory and the fourfold pattern —
      the paper the drafted key should have cited for that claim.
