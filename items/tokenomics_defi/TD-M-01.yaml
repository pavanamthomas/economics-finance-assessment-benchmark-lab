id: TD-M-01
domain: tokenomics_defi
subdomain: constant_product_spot
difficulty: MEDIUM
learning_objective: >
  Read the constant-product spot price as y/x, the marginal rate,
  not as a statement about a finite trade.
stem: >
  A fee-free constant-product pool holds x = 200 of token X and
  y = 100 of token Y, so k = x y = 20,000. A commentator says the
  price of X in units of Y is 2, "because there is twice as much X,"
  and that a trader can therefore sell 50 X for 100 Y at that price.
  Which statement is right?
options:
  A: >
    The commentator is right on both the price and the finite trade.
  B: >
    The price is 2, but the finite trade cannot be 100 Y because of slippage; the spot is still 2.
  C: >
    The price is 0.50, and a finite sale of 50 X *is* filled at 0.50 because the pool is constant-product, which is linear.
  D: >
    The marginal (spot) price of X in Y is p = y/x = 0.50, not 2. A finite sale of 50 X is *not* executed at that spot: the average execution price is y/(x+Δx) = 100/250 = 0.40. Confusing the reserve ratio x/y with y/x, and confusing spot with a finite fill, are two separate errors.
  E: >
    k = 20,000 already prices X at 20,000, which is the only economically meaningful number.
  F: >
    With no fee, finite trades do not move the price, so 50 X for 100 Y is feasible at any quoted p.
  G: >
    The price of X in Y is x/y = 2 if one uses X as numeraire, so the commentator's 2 is right under a units change and the trade is then 50 X for 25 Y.
  H: >
    Constant-product pools do not have a well-defined spot price; only the average fill is defined.
  I: >
    Because k is constant, the product of the two prices y/x and x/y must be k, hence p = sqrt(k) ≈ 141.
  J: >
    A 50 X sale is large relative to x = 200, so the pool cannot trade at all; only infinitesimal trades exist.
correct_option: D
solution_summary: >
  Spot is y/x = 1/2. Finite sale of Δx executes at y/(x+Δx) < spot.
  The commentator inverted the ratio and ignored slippage.
solution_derivation: >
  For a sale of X into the pool, the marginal Y received per additional X is p = -dy/dx = y/x along x y = k. Here 100/200 = 0.50 Y per X.
  The inverted ratio x/y = 2 is Y's price in X, or "how many X per
  Y," not the price of X in Y. A sale of Δx = 50 sends x' = 250,
  y' = 20,000/250 = 80, so Δy = 20, not 100. Average price =
  20/50 = 0.40 = 100/250. Constant-product is not linear (C).
  No-fee does not freeze price (F). Units change (G) that keeps
  "price = 2" but then fills 50 X for 25 Y is internally mixed:
  25 Y would be a fill at 0.50, which is the *spot*, not the
  finite fill. Spot is well-defined as the derivative (H).
  sqrt(k) is a geometric-mean reserve, not a price (I). Finite
  trades exist (J); they just are not at spot.
assumptions:
  - >
    Fee-free CPAMM, no concentrated liquidity, no external arbiter inside the trade.
  - >
    Price of X is in units of Y.
numerical_check:
  kind: amm_execution
  params:
    x: 200.0
    y: 100.0
    dx: 50.0
  expected:
    value: 0.4
    spot0: 0.5
distractor_rationales:
  A:
    taxonomy: WRONG_DENOMINATOR
    why_chosen: >
      More X looks like X is more valuable.
    why_wrong: >
      More X, given k, means X is cheaper in Y.
  B:
    taxonomy: SIGN_REVERSAL
    why_chosen: >
      Slippage remembered, ratio still inverted.
    why_wrong: >
      Spot is 0.50, not 2.
  C:
    taxonomy: APPROXIMATION_OUTSIDE_RANGE
    why_chosen: >
      Spot as a usable fill for any size.
    why_wrong: >
      CPAMM is strictly concave in the trade size.
  D:
    taxonomy: CORRECT_KEY
    why_chosen: >
      p = y/x and finite fill at y/(x+Δx).
    why_wrong: >
      This letter is the keyed option. It is not a distractor.
  E:
    taxonomy: INCORRECT_NORMALIZATION
    why_chosen: >
      k as a price.
    why_wrong: >
      k is a product of quantities.
  F:
    taxonomy: VIOLATED_ASSUMPTION
    why_chosen: >
      Fees as the only wedge.
    why_wrong: >
      Price impact exists at fee zero.
  G:
    taxonomy: INCORRECT_NORMALIZATION
    why_chosen: >
      Numeraire games.
    why_wrong: >
      Mixes a units story with the wrong finite fill.
  H:
    taxonomy: LEVEL_VS_MARGINAL
    why_chosen: >
      Only average fills are observed.
    why_wrong: >
      The derivative exists: y/x.
  I:
    taxonomy: INCORRECT_NORMALIZATION
    why_chosen: >
      Geometric means in AMM lore.
    why_wrong: >
      sqrt(k) has units of quantity, not a price, and the product
      of the two prices is 1, not k.
  J:
    taxonomy: APPROXIMATION_OUTSIDE_RANGE
    why_chosen: >
      Large trades as undefined.
    why_wrong: >
      The closed form is defined for any Δx > 0 with x+Δx finite.
misconception_tags:
  - WRONG_DENOMINATOR
  - AVERAGE_VS_MARGINAL_EXECUTION_PRICE
  - INCORRECT_NORMALIZATION
difficulty_rationale: >
  Direct application of p = y/x and one finite-trade formula.
  Medium. The finite-trade confusion is planted here so TD-E-01
  can go further.
ambiguity_audit: >
  Price of X in Y is stated. 50 X is a sale into the pool.
uniqueness_check: >
  B is the only option with both the right spot and the right
  finite fill. G almost sneaks a units dodge; the fill it quotes
  is still the spot, not the finite price.
references:
  - key: angerisetal2021
    claim_supported: >
      Constant-product markets: spot price as the reserve ratio
      and strictly worse execution for finite trades.
  - key: uniswapv2
    claim_supported: >
      Uniswap v2 core: x y = k mechanics used as the educational
      CPAMM.
verification:
  primary_solution: >
    p = y/x; Δy = y − k/(x+Δx).
  independent_check: >
    Closed form, quadrature, and geometric mean of spots agree
    in efablab.checks.amm for (200, 100, 50).
  invariant_or_boundary_check: >
    Δx → 0 ⇒ average execution → spot 0.50. Δx = 50 is far from
    that limit.
revision_notes: >
  None.
