id: UE-E-02
domain: urban_economics
subdomain: roback_spatial_equilibrium
difficulty: EXPERT
learning_objective: >
  Use wages *and* rents to separate amenity from productivity in
  a Roback spatial equilibrium; refuse wages alone as productivity.
stem: >
  Three otherwise comparable cities have similar housing-supply
  elasticities and one dominant local shock each. City P has high wages
  and high rents. City A has low wages and high rents. City U has high
  wages and low rents. A commentator
  ranks productivity by wages alone: P and U are "high
  productivity," A is "low productivity," and high rents are
  ignored as a housing-supply nuisance. Which statement is right
  in a Roback spatial-equilibrium reading?
options:
  A: >
    Mobile workers equalise utility. High wages can compensate for a disamenity or can reflect high productivity; high rents can capitalise an amenity or a productivity-driven demand for land. Under the stated comparability assumptions, P (high w, high R) is the productivity-like configuration, A (low w, high R) is amenity-like, and U (high w, low R) is disamenity-like. The wage-rent pair, not wages alone, carries the spatial-equilibrium information.
  B: >
    The commentator is right. Wages are the marginal product.
  C: >
    High rents always mean high amenities, so P is amenity-driven and cannot be productive.
  D: >
    Low rents always mean elastic housing supply, so U is the most productive city, because firms would not pay high wages otherwise.
  E: >
    Roback requires wages and rents to move in the same direction, so U is impossible and the stem is internally inconsistent.
  F: >
    Productivity is identified from wages after subtracting rents, so P and A are equal if w − R is equal.
  G: >
    The commentator is right for tradable-goods productivity, because rents are nontradable and drop out.
  H: >
    Amenity cities must have low rents, because people pay for amenities with wages only.
  I: >
    Spatial equilibrium cannot generate high wages and high rents together, because that would attract infinite migration.
  J: >
    Ranking by wages is valid if labour is immobile, which is the Roback assumption.
correct_option: A
solution_summary: >
  Roback uses the (w, R) pair. Productivity shocks raise both;
  amenity shocks raise R and lower (or do not raise) w;
  disamenities raise w and lower R. Wages alone are not the
  ranking.
solution_derivation: >
  Workers: u(w, R, a) = u_bar. Firms in tradable production:
  cost(w, R, A_prod) = 1 (or a zero-profit condition). An
  increase in productivity A_prod raises labour and land demand:
  w and R both tend to rise (P). An increase in amenity a
  attracts workers, raising R and allowing firms to pay lower w
  (A). A disamenity does the reverse (U's high w, low R is the
  canonical compensating-wage configuration). Elastic housing
  supply mutes the R response, so a productive city could look
  somewhat like U on rents; that is a reason not to treat U as
  identical to P, and also a reason D is too strong
  ("U is the most productive"). w − R (F) is not the Roback
  sufficient statistic; the two prices enter worker and firm
  conditions differently. Immobility (J) is the opposite of
  Roback. Infinite migration (I) is shut by rising R (and any
  congestion). Same-direction (E) is the productivity case, not
  a requirement on all shocks. Tradable/nontradable (G): rents
  still enter firm costs if land is used in production, and they
  enter worker utility always.
assumptions:
  - >
    Workers are mobile across the three cities; firms in tradable goods have zero-profit conditions involving w and R.
  - >
    Labels P, A, U are configurations, not estimated residuals from a real system.
  - >
    Housing-supply elasticity is comparable across the three stylised cities; relaxing that assumption would weaken this classification.
distractor_rationales:
  A:
    taxonomy: CORRECT_KEY
    why_chosen: >
      Assigns P/A/U to productivity/amenity/disamenity-like
      cells and refuses wages-only ranking.
    why_wrong: >
      This letter is the keyed option. It is not a distractor.
  B:
    taxonomy: PARTIAL_VS_GENERAL_EQUILIBRIUM
    why_chosen: >
      MPL = w in a single-city firm problem.
    why_wrong: >
      Across cities, w also compensates for a and R.
  C:
    taxonomy: NECESSARY_VS_SUFFICIENT
    why_chosen: >
      High R as amenity.
    why_wrong: >
      High R also comes with productivity (P).
  D:
    taxonomy: APPROXIMATION_OUTSIDE_RANGE
    why_chosen: >
      Elastic supply plus high wages as a firm test.
    why_wrong: >
      U is also the disamenity cell. Not identified as "most
      productive."
  E:
    taxonomy: VIOLATED_ASSUMPTION
    why_chosen: >
      Co-movement of w and R in some textbook pictures.
    why_wrong: >
      Opposite co-movement is the amenity/disamenity signature.
  F:
    taxonomy: INCORRECT_NORMALIZATION
    why_chosen: >
      Real wages as w minus housing.
    why_wrong: >
      Not the Roback pair of equilibrium conditions.
  G:
    taxonomy: WRONG_INFORMATION_SET
    why_chosen: >
      Tradable versus nontradable split.
    why_wrong: >
      Land still prices both sides.
  H:
    taxonomy: SIGN_REVERSAL
    why_chosen: >
      Compensating differentials taught as wage-only.
    why_wrong: >
      Amenities are paid in rents (and sometimes lower wages).
  I:
    taxonomy: EQUILIBRIUM_FEEDBACK_IGNORED
    why_chosen: >
      Unstable migration.
    why_wrong: >
      Rents rise and shut the flood.
  J:
    taxonomy: VIOLATED_ASSUMPTION
    why_chosen: >
      Immobility as a way to read wages as MPL.
    why_wrong: >
      Roback is a mobility model.
misconception_tags:
  - PARTIAL_VS_GENERAL_EQUILIBRIUM
  - WRONG_INFORMATION_SET
  - SIGN_REVERSAL
difficulty_rationale: >
  Expert: two-equation spatial equilibrium and three
  configurations that wages alone collapse.
ambiguity_audit: >
  U is labelled "disamenity-like, or productive with elastic
  housing" so that elastic-supply is not a second key. The
  commentator's ranking is still wrong.
uniqueness_check: >
  B is the only option that uses both prices and refuses a
  wages-only productivity rank. If labour were immobile, A would
  be closer; Roback assumes mobility.
references:
  - key: roback1982
    claim_supported: >
      Wages and rents jointly identify amenity versus
      productivity differences across locations under spatial
      equilibrium.
verification:
  primary_solution: >
    Sign table: (Δw, ΔR) for productivity, amenity, disamenity.
  independent_check: >
    Worker indifference: a ↑ must be offset by some mix of ↓w
    or ↑R. Firm zero profit: A_prod ↑ supports ↑w and ↑R. The
    two shocks are not collinear in (w, R) space.
  invariant_or_boundary_check: >
    If rents are institutionally frozen, the Roback split
    collapses toward wages, and the commentator is closer. They
    are not frozen in the stem.
revision_notes: >
  Draft ranked U as "definitely disamenity." Elastic housing
  makes that over-sure; the language was softened without
  restoring the commentator.
