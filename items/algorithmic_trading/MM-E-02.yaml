id: MM-E-02
domain: algorithmic_trading_market_microstructure
subdomain: order_imbalance_versus_profit
difficulty: EXPERT
learning_objective: >
  Separate a short-horizon predictive relation between order imbalance
  and mid-quote changes from the existence of an exploitable net-of-cost
  profit.
stem: >
  On a limit-order-book name, define a one-second order-flow imbalance
  as (marketable buy volume − marketable sell volume) over that second.
  A regression of the subsequent one-second mid-quote change on this
  imbalance, estimated out of sample, has a positive slope and a t of
  8. The same imbalance does not forecast the subsequent one-second
  change in the microprice after subtracting a 1-second-ahead half-spread
  cost of taking 0.1 percent of advertised depth. A commentator concludes
  that "imbalance predicts prices, therefore a taker can earn the
  coefficient as alpha." Which statement is the right response?
options:
  A: >
    The commentator is right: a significant out-of-sample slope is a tradable edge for a price-taker, by definition of prediction.
  B: >
    Imbalance can forecast the mid because taking at the touch *is* how the mid gets revised (mechanical plus informational). That predictive slope is not the P&L of a second taker who pays the spread and walks depth; the net-of-cost regression already says the coefficient is not take-alpha.
  C: >
    The t of 8 is so large that costs cannot matter; costs affect R², not slopes.
  D: >
    The right trade is to *provide* liquidity in the direction of imbalance, collecting the spread while enjoying the predicted mid move.
  E: >
    If the microprice regression is insignificant, the mid regression must have been a look-ahead artefact, so both results should be discarded.
  F: >
    Order imbalance is a sufficient statistic for Kyle's λ, so the slope *is* λ and is therefore the market maker's expected profit.
  G: >
    The taker earns the slope on the first 0.1 percent of depth and loses it on the rest, so the strategy is to clip tiny size.
  H: >
    Prediction of the mid is equivalent to prediction of the next trade price, because bounce averages out in one second.
  I: >
    A t of 8 out of sample means the researcher used the full sample to choose the imbalance definition, so none of the results is usable.
  J: >
    Because advertised depth is not executable, both regressions should be run on trade prices only, which would restore the commentator's conclusion.
correct_option: B
solution_summary: >
  A forecast of the mid can be generated by the same marketable flow
  that moves quotes. That is not the P&L of another taker. The
  net-of-cost regression is the relevant object for the commentator's
  claim, and it does not support take-alpha.
solution_derivation: >
  Let I_t be signed marketable volume and Δm_{t+1} the next mid change.
  E[Δm_{t+1} | I_t] ≠ 0 is documented in order-book event studies
  (Cont–Kukanov–Stoikov and related work): marketable flow is
  associated with contemporaneous and subsequent quote revision,
  through depletion and through information. A taker's P&L for a buy
  is not Δm; it is (exit mark − ask_fill) minus fees. Subtracting a
  take cost and using a microprice mark is one way to approximate
  that P&L. The stem says that regression does not find a positive
  coefficient. Therefore the commentator's "therefore" does not go
  through. Providing liquidity in the direction of imbalance (D) is a
  different strategy that faces pick-off risk: arriving marketable
  flow is exactly the flow that hits resting size. Tiny clips (G)
  still pay the spread and still do not inherit the mid-regression
  slope as cash. Kyle's λ is a mapping from *net* order flow to
  price in a batch model; it is not identified by this regression and
  is not MM profit in a limit-order book. Look-ahead is not implied
  by the two regressions disagreeing; they are different left-hand
  sides. Sample-snoop risk (I) is a general caution, not licensed as
  a fact by the stem.
assumptions:
  - >
    The two regressions are as stated and are not otherwise misspecified in a way the stem conceals.
  - >
    "Taker" means a marketable order paying the touch or walking the book, not a midpoint peg.
  - >
    Advertised depth is the displayed size used in the cost adjustment, not hidden size.
  - >
    No claim is made about maker-rebate strategies beyond rejecting D as licensed by the stem.
distractor_rationales:
  A:
    taxonomy: CORRELATION_VS_IDENTIFICATION
    why_chosen: >
      Prediction is colloquially treated as alpha.
    why_wrong: >
      Prediction of a non-executable mark is not taker P&L.
  B:
    taxonomy: CORRECT_KEY
    why_chosen: >
      Keeps the mid forecast, denies the commentator's therefore, and
      points at the net-of-cost regression.
    why_wrong: >
      This letter is the keyed option. It is not a distractor.
  C:
    taxonomy: WRONG_DENOMINATOR
    why_chosen: >
      Large t-statistics are treated as dominating frictions.
    why_wrong: >
      Costs shift the *level* of P&L. A slope on mids is not insulated
      from a subtractive spread.
  D:
    taxonomy: SIGN_REVERSAL
    why_chosen: >
      If taking is expensive, providing looks like the way to harvest
      the same forecast.
    why_wrong: >
      Resting on the side that imbalance is about to hit is how one
      gets adversely selected. The stem does not identify a maker edge.
  E:
    taxonomy: NECESSARY_VS_SUFFICIENT
    why_chosen: >
      Disagreement between two price series is often a look-ahead tell.
    why_wrong: >
      Different marks plus a cost adjustment *should* disagree if the
      paper edge was the spread.
  F:
    taxonomy: INCORRECT_NORMALIZATION
    why_chosen: >
      Kyle's λ is "impact per unit flow," which looks like this slope.
    why_wrong: >
      The regression is not Kyle's projection, and λ is not a limit-order
      taker's alpha.
  G:
    taxonomy: APPROXIMATION_OUTSIDE_RANGE
    why_chosen: >
      Small size is how one hopes to avoid impact.
    why_wrong: >
      Small size still pays the half-spread. The net-of-cost regression
      is already scaled to 0.1 percent of depth.
  H:
    taxonomy: AVERAGE_VS_MARGINAL_EXECUTION_PRICE
    why_chosen: >
      Over a one-second bucket bounce might average out.
    why_wrong: >
      Even if bounce averages, the take still occurs at the ask or bid,
      not at the mid.
  I:
    taxonomy: VIOLATED_ASSUMPTION
    why_chosen: >
      Definition-snoop is a real empirical disease.
    why_wrong: >
      The stem does not say the imbalance definition was searched. It
      is not a licensed conclusion.
  J:
    taxonomy: WRONG_INFORMATION_SET
    why_chosen: >
      Trade prices are executable by definition.
    why_wrong: >
      A regression on last-trade prices puts bounce back in and still
      does not construct a feasible second-taker P&L.
misconception_tags:
  - CORRELATION_VS_IDENTIFICATION
  - AVERAGE_VS_MARGINAL_EXECUTION_PRICE
  - SIGN_REVERSAL
difficulty_rationale: >
  Expert because it requires holding two true statements at once —
  imbalance forecasts mids, and that forecast is not take-alpha —
  against a commentator who treats the first as sufficient for the
  second.
ambiguity_audit: >
  The net-of-cost regression is given as a fact, so the item is not a
  fishing expedition about whether costs "might" wipe the edge. Maker
  strategies are discussed only to reject D as licensed.
uniqueness_check: >
  B is the only option that (i) accepts the mid regression, (ii) rejects
  the commentator, and (iii) uses the cost-adjusted regression as the
  relevant object. D proposes a different strategy the stem does not
  identify. If hidden size were large, take costs could be smaller;
  the stem's cost adjustment already uses advertised depth, and B does
  not require that 0.1 percent is the only relevant size.
references:
  - key: contkukanovstoikov2014
    claim_supported: >
      Order-book events and imbalance have short-horizon predictive
      content for price changes; that is a statement about quotes, not
      about post-cost taker P&L.
  - key: kyle1985
    claim_supported: >
      λ maps net order flow to price in a batch auction. It is cited
      as the object F misuses, not as identified by this regression.
verification:
  primary_solution: >
    Contrast E[Δmid | I] with E[take P&L | I], the latter already
    reported as not positive.
  independent_check: >
    Accounting identity: take P&L for a buy ≈ Δmid − half-spread −
    walk. A positive E[Δmid | I] is compatible with a non-positive
    E[take P&L | I] whenever E[half-spread + walk | I] is larger.
  invariant_or_boundary_check: >
    If half-spread and walk are identically zero, the two regressions
    coincide and the commentator would be right. The stem is not that
    market.
revision_notes: >
  Draft included a numerical "edge after costs" that could not be
  verified from the stem. Replaced with a qualitative net-of-cost
  regression supplied as data, so the key does not invent a number.
